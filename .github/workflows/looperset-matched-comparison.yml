name: LOOPerSet matched Transformer vs LSTM experiment

on:
  push:
    branches:
      - "experiment-runner/**"
    paths:
      - "experiment-trigger.txt"
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs for each model"
        required: true
        default: "5"
        type: choice
        options: ["1", "5", "10", "20"]
      train_programs:
        description: "Candidate training programs before compatibility filtering"
        required: true
        default: "1000"
        type: choice
        options: ["100", "300", "1000", "5000"]
      validation_programs:
        description: "Candidate validation programs before compatibility filtering"
        required: true
        default: "300"
        type: choice
        options: ["30", "100", "300", "1000"]
      seed:
        description: "Reproducible sampling and training seed"
        required: true
        default: "42"
        type: string

permissions:
  contents: read

concurrency:
  group: looperset-matched-comparison
  cancel-in-progress: false

jobs:
  matched-comparison:
    name: Prepare common data, train both models and compare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATASET_REVISION: d97fc54
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Resolve experiment configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "push":
              values = {}
              for line in Path("experiment-trigger.txt").read_text().splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  key, separator, value = line.partition("=")
                  if not separator or key in values:
                      raise ValueError(f"Invalid or duplicate trigger setting: {line}")
                  values[key.strip()] = value.strip()
              required = {"TRAIN_PROGRAMS", "VALID_PROGRAMS", "EXPERIMENT_SEED", "EXPERIMENT_EPOCHS"}
              if set(values) != required:
                  raise ValueError(f"Trigger settings must be exactly {sorted(required)}")
              train = values["TRAIN_PROGRAMS"]
              valid = values["VALID_PROGRAMS"]
              seed = values["EXPERIMENT_SEED"]
              epochs = values["EXPERIMENT_EPOCHS"]
          elif event_name == "workflow_dispatch":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              inputs = event.get("inputs", {})
              train = inputs.get("train_programs", "1000")
              valid = inputs.get("validation_programs", "300")
              seed = inputs.get("seed", "42")
              epochs = inputs.get("epochs", "5")
          else:
              raise ValueError(f"Unsupported workflow event: {event_name}")

          if train not in {"100", "300", "1000", "5000"}:
              raise ValueError(f"Unsupported training program count: {train}")
          if valid not in {"30", "100", "300", "1000"}:
              raise ValueError(f"Unsupported validation program count: {valid}")
          if epochs not in {"1", "5", "10", "20"}:
              raise ValueError(f"Unsupported epoch count: {epochs}")
          if not seed.isdigit() or int(seed) < 0:
              raise ValueError(f"Seed must be a non-negative integer: {seed}")

          config = {
              "TRAIN_PROGRAMS": train,
              "VALID_PROGRAMS": valid,
              "EXPERIMENT_SEED": seed,
              "EXPERIMENT_EPOCHS": epochs,
              "OUTPUT_DIR": f"runs/matched_seed{seed}_{train}_{valid}",
              "LSTM_WORK_DIR": f"runs/lstm_work_seed{seed}",
          }
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in config.items():
                  output.write(f"{key}={value}\n")
          print(json.dumps(config, indent=2))
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . huggingface_hub pytest
      - name: Record experiment configuration
        run: |
          mkdir -p data/raw data/processed "${OUTPUT_DIR}" "${LSTM_WORK_DIR}"
          python - <<'PY'
          import json, os, platform, torch
          from pathlib import Path
          metadata = {
              "repository_commit": os.environ["GITHUB_SHA"],
              "dataset": "Mascinissa/LOOPerSet",
              "dataset_revision": os.environ["DATASET_REVISION"],
              "dataset_license": "CC-BY-4.0",
              "candidate_training_programs": int(os.environ["TRAIN_PROGRAMS"]),
              "candidate_validation_programs": int(os.environ["VALID_PROGRAMS"]),
              "epochs_per_model": int(os.environ["EXPERIMENT_EPOCHS"]),
              "seed": int(os.environ["EXPERIMENT_SEED"]),
              "device": "cpu",
              "runner": platform.platform(),
              "python": platform.python_version(),
              "pytorch": torch.__version__,
              "comparison_status": "Matched LSTM and Transformer; identical program/schedule subsets and target convention",
          }
          Path(os.environ["OUTPUT_DIR"], "experiment_metadata.json").write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY
      - name: Download pinned LOOPerSet v2.1 compact files
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import os
          revision = os.environ["DATASET_REVISION"]
          files = [
              "data/pact25/looperset_v2_pact_train_compact.jsonl.gz",
              "data/pact25/looperset_v2_pact_validation_compact.jsonl.gz",
          ]
          for filename in files:
              path = hf_hub_download(
                  repo_id="Mascinissa/LOOPerSet", repo_type="dataset",
                  filename=filename, revision=revision, local_dir="data/raw/looperset",
              )
              print(f"Downloaded {filename}: {Path(path).stat().st_size:,} bytes")
          PY
      - name: Clean full train split
        run: |
          python scripts/clean_looperset.py \
            --input data/raw/looperset/data/pact25/looperset_v2_pact_train_compact.jsonl.gz \
            --output data/processed/looperset_train_cleaned.jsonl.gz \
            --max-programs 100000
      - name: Clean full validation split
        run: |
          python scripts/clean_looperset.py \
            --input data/raw/looperset/data/pact25/looperset_v2_pact_validation_compact.jsonl.gz \
            --output data/processed/looperset_validation_cleaned.jsonl.gz \
            --max-programs 100000
      - name: Create deterministic candidate program subsets
        run: |
          python scripts/create_streaming_subsets.py \
            --train data/processed/looperset_train_cleaned.jsonl.gz \
            --valid data/processed/looperset_validation_cleaned.jsonl.gz \
            --output-dir data/processed \
            --train-programs "${TRAIN_PROGRAMS}" \
            --valid-programs "${VALID_PROGRAMS}" \
            --seed "${EXPERIMENT_SEED}"
      - name: Audit compatibility of both model implementations
        run: |
          mkdir -p "${OUTPUT_DIR}/audit"
          python scripts/audit_lstm_compatibility.py \
            --train "data/processed/looperset_train_${TRAIN_PROGRAMS}_remote_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --valid "data/processed/looperset_validation_${VALID_PROGRAMS}_remote_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --output "${OUTPUT_DIR}/audit"
      - name: Build identical common datasets for both models
        run: |
          python scripts/create_common_datasets.py \
            --input "data/processed/looperset_train_${TRAIN_PROGRAMS}_remote_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --audit "${OUTPUT_DIR}/audit/train_schedules.csv" \
            --output "data/processed/looperset_train_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            | tee "${OUTPUT_DIR}/train_common_summary.txt"
          python scripts/create_common_datasets.py \
            --input "data/processed/looperset_validation_${VALID_PROGRAMS}_remote_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --audit "${OUTPUT_DIR}/audit/validation_schedules.csv" \
            --output "data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            | tee "${OUTPUT_DIR}/validation_common_summary.txt"
      - name: Verify common dataset invariants
        run: |
          python scripts/verify_cleaned_data.py \
            --train "data/processed/looperset_train_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --valid "data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz"
      - name: Train Transformer on common training data
        run: |
          python -m looper_cost_model.transformer.train \
            --train "data/processed/looperset_train_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --valid "data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --output "${OUTPUT_DIR}/transformer" \
            --epochs "${EXPERIMENT_EPOCHS}" --batch-size 256 \
            --seed "${EXPERIMENT_SEED}" --device cpu
      - name: Evaluate Transformer on common validation data
        run: |
          python -m looper_cost_model.transformer.evaluate \
            --data "data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            --checkpoint "${OUTPUT_DIR}/transformer/best_transformer.pt" \
            --output "${OUTPUT_DIR}/transformer/analysis" \
            --batch-size 256 --device cpu \
            | tee "${OUTPUT_DIR}/transformer_metrics.txt"
      - name: Train original recursive-LSTM baseline on common training data
        run: |
          python -m looper_cost_model.train \
            experiment.name=matched_lstm_seed${EXPERIMENT_SEED} \
            experiment.base_path="${LSTM_WORK_DIR}" \
            data.train_file="data/processed/looperset_train_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            data.valid_file="data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            data.batch_size=256 data.nb_workers=4 data.min_functions_per_footprint=0 \
            training.device=cpu training.max_epochs="${EXPERIMENT_EPOCHS}" \
            training.seed="${EXPERIMENT_SEED}" training.lr=0.00004 training.weight_decay=0.015 \
            | tee "${OUTPUT_DIR}/lstm_training.txt"
      - name: Evaluate original recursive-LSTM baseline on common validation data
        run: |
          python -m looper_cost_model.evaluate \
            experiment.name=matched_lstm_seed${EXPERIMENT_SEED} \
            experiment.base_path="${LSTM_WORK_DIR}" \
            data.train_file="data/processed/looperset_train_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            data.valid_file="data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            data.batch_size=256 data.nb_workers=4 data.min_functions_per_footprint=0 \
            training.device=cpu training.seed="${EXPERIMENT_SEED}" \
            eval.weights_path="${LSTM_WORK_DIR}/weights/best_model_matched_lstm_seed${EXPERIMENT_SEED}.pt" \
            | tee "${OUTPUT_DIR}/lstm_metrics.txt"
          mkdir -p "${OUTPUT_DIR}/lstm"
          cp "${LSTM_WORK_DIR}/weights/best_model_matched_lstm_seed${EXPERIMENT_SEED}.pt" "${OUTPUT_DIR}/lstm/"
          cp "${LSTM_WORK_DIR}/logs/"*.log "${OUTPUT_DIR}/lstm/" || true
      - name: Export LSTM per-program predictions and paired comparison
        env:
          MATCHED_LSTM_ANALYSIS_DIR: ${{ env.OUTPUT_DIR }}/lstm/analysis
        run: |
          python scripts/evaluate_matched_lstm.py \
            experiment.name=matched_lstm_seed${EXPERIMENT_SEED} \
            experiment.base_path="${LSTM_WORK_DIR}" \
            data.train_file="data/processed/looperset_train_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            data.valid_file="data/processed/looperset_validation_common_seed${EXPERIMENT_SEED}.jsonl.gz" \
            data.batch_size=256 data.nb_workers=4 data.min_functions_per_footprint=0 \
            training.device=cpu training.seed="${EXPERIMENT_SEED}" \
            eval.weights_path="${LSTM_WORK_DIR}/weights/best_model_matched_lstm_seed${EXPERIMENT_SEED}.pt"
          python scripts/compare_paired_metrics.py \
            --transformer "${OUTPUT_DIR}/transformer/analysis/transformer_program_metrics.csv" \
            --lstm "${MATCHED_LSTM_ANALYSIS_DIR}/lstm_program_metrics.csv" \
            --output "${OUTPUT_DIR}/paired_analysis" \
            --seed "${EXPERIMENT_SEED}" --bootstrap-resamples 10000
      - name: Write matched comparison summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["OUTPUT_DIR"])
          metadata = out / "experiment_metadata.json"
          if not metadata.exists():
              raise SystemExit("Experiment metadata missing; inspect prior step logs")
          report = {"metadata": json.loads(metadata.read_text())}
          for name in ("train", "validation"):
              p = out / "audit" / f"{name}_summary.json"
              if p.exists():
                  report[f"{name}_compatibility"] = json.loads(p.read_text())
              p = Path("data/processed") / f"looperset_{name}_common_seed{os.environ['EXPERIMENT_SEED']}.jsonl.gz.summary.json"
              if p.exists():
                  report[f"{name}_common_dataset"] = json.loads(p.read_text())
          (out / "matched_comparison_summary.json").write_text(json.dumps(report, indent=2))
          PY
      - name: Upload matched experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looperset-matched-comparison-seed${{ github.event.inputs.seed || '42' }}
          path: |
            ${{ env.OUTPUT_DIR }}
            data/processed/looperset_train_common_seed*.jsonl.gz
            data/processed/looperset_validation_common_seed*.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
