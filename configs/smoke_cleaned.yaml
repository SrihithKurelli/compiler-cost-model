experiment:
  name: looperset_cleaned_smoke
  base_path: ./runs/cleaned_smoke

data:
  train_file: ../data/processed/looperset_train_cleaned_sample.jsonl.gz
  valid_file: ../data/processed/looperset_validation_cleaned_sample.jsonl.gz
  batch_size: 64
  nb_workers: 1
  min_functions_per_footprint: 0

model:
  input_size: 846
  comp_embed_layer_sizes: [600, 350, 200, 180]
  drops: [0.05, 0.05, 0.05, 0.05]

training:
  device: cpu
  lr: 0.00004
  weight_decay: 0.015
  max_epochs: 2
  seed: 42
  continue_from: null
  log_every: 1

wandb:
  enabled: false
  project: looper_cost_model

eval:
  weights_path: null