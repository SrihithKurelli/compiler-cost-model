
experiment:
  name: looperset_pilot_1000
  base_path: ./runs/pilot_1000

data:
  train_file: ../data/processed/looperset_train_1000_cleaned.jsonl.gz
  valid_file: ../data/processed/looperset_validation_300_cleaned.jsonl.gz
  batch_size: 64
  nb_workers: 1
  min_functions_per_footprint: 0

model:
  input_size: 846
  comp_embed_layer_sizes: [600, 350, 200, 180]
  drops: [0.05, 0.05, 0.05, 0.05]

training:
  device: cpu
  lr: 0.00004
  weight_decay: 0.015
  max_epochs: 5
  seed: 42
  continue_from: null
  log_every: 1

wandb:
  enabled: false
  project: looper_cost_model

eval:
  weights_path: ./runs/pilot_1000/weights/best_model_looperset_pilot_1000.pt
